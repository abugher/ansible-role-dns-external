---
dkim_selector:          'mail'
install_packages:
  - 'dnsmasq'
# https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=860064
install_files:
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                "files/conf/default.dnsmasq"
    dest:               '/etc/default/dnsmasq'
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    src:                "files/bin/dns_root_agent_cronjob"
    dest:               '/usr/local/bin/dns_root_agent_cronjob'
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    src:                "files/cron.d/dns_root_agent"
    dest:               '/etc/cron.d/dns_root_agent'
template_files:
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    src:                "templates/bin/dns_root_agent.j2"
    dest:               '/usr/local/bin/dns_root_agent'
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                'templates/conf/dnsmasq.conf.j2'
    dest:               '/etc/dnsmasq.conf'
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    src:                'templates/dhclient-exit-hooks.d/update-dns.j2'
    dest:               '/etc/dhcp/dhclient-exit-hooks.d/update-dns'
# It would be good to immediately update /etc/hosts with all current names and
# aliases for host and domain.  A shell command could potentially be added to
# run the hook script, here, but that would require providing the variables
# normally set by dhclient.
create_files:
  - owner:              'neuronpointer'
    group:              'root'
    mode:               '0644'
    state:              'touch'
    path:               '/etc/neuron.neuronpointer.net'
system_groups:
  - 'neuronpointer'
system_users:
  - 'neuronpointer'
authorized_keys:
  - user:               'neuronpointer'
    keyfile:            "inventory/hosts/{{ groups['dns-internal'][0] }}/users/updatedns/files/ssh_keys/id_rsa.pub"
allow_users:
  - 'neuronpointer'
enable_services:
  - 'dnsmasq'
start_services:
  - 'dnsmasq'
restart_services:
  - 'dnsmasq'
